name: Build ARM64 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore release signing key (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/upload.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload.jks\n' \
            "${{ secrets.STORE_PASS }}" "${{ secrets.KEY_PASS }}" "${{ secrets.KEY_ALIAS }}" \
            > android/key.properties

      - name: Build ARM64-only APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name 1.0.0 \
            --build-number ${{ github.run_number }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-souq-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --generate-notes

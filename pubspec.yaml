name: atlas_souq
description: "أطلس السوق — دراسة مواقع فروع التجزئة في المملكة العربية السعودية"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  go_router: ^14.8.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  sqflite: ^2.4.6
  path: ^1.9.0
  path_provider: ^2.1.5
  excel: ^4.0.6
  http: ^1.4.0
  flutter_secure_storage: ^11.2.0
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
